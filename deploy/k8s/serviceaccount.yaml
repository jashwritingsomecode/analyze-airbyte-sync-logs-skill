# Dedicated, least-privilege identity for the triage CronJob.
# It needs NO Kubernetes API permissions (it only talks to the Airbyte HTTP
# API), so no Role/RoleBinding is attached. Disabling token automounting keeps
# the pod from carrying a usable API token it never needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sync-log-triage
  labels:
    app.kubernetes.io/name: sync-log-triage
automountServiceAccountToken: false
