apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-log-triage
  labels:
    app.kubernetes.io/name: sync-log-triage
spec:
  # Every 30 minutes. Adjust to taste; finer granularity = faster alerting.
  schedule: "*/30 * * * *"
  # Never run two polls at once (they'd race on the state file / PVC).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  # Bounded run history = a lightweight audit trail without unbounded growth.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sync-log-triage
        spec:
          restartPolicy: Never
          serviceAccountName: sync-log-triage
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000              # makes the PVC writable by the non-root user
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: triage
              # Stdlib-only scripts: any stock Python image works. Pin a digest
              # in production. No app code is baked in — it is mounted from the
              # analyzer-scripts ConfigMap, so this image never needs rebuilding.
              image: python:3.12-slim
              command: ["/bin/bash", "/opt/analyzer/scripts/triage-cron.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                # --- Non-sensitive config (safe in plain manifest) ---
                # Confirm the in-cluster Airbyte API URL with the discovery
                # commands in deploy/k8s/README.md before applying.
                - name: AIRBYTE_API_URL
                  value: "http://faros-airbyte-prod-faros-airbyte-airbyte-server-svc:8001"
                - name: TRIAGE_WORK_DIR
                  value: "/data"
                - name: TRIAGE_FETCH_ALL
                  value: "0"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                # --- Email/Teams notification (optional) ---
                - name: SMTP_HOST
                  value: ""            # set to your relay to enable alerts
                - name: SMTP_PORT
                  value: "587"
                - name: SMTP_FROM
                  value: "airbyte-triage@example.com"
                - name: SMTP_TO
                  value: "data-platform-alerts@example.com"
                - name: SMTP_STARTTLS
                  value: "1"
                # --- Sensitive values (sourced from the Secret) ---
                - name: AIRBYTE_API_USER
                  valueFrom:
                    secretKeyRef:
                      name: sync-log-triage-secrets
                      key: AIRBYTE_API_USER
                      optional: true
                - name: AIRBYTE_API_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sync-log-triage-secrets
                      key: AIRBYTE_API_PASSWORD
                      optional: true
                - name: SMTP_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: sync-log-triage-secrets
                      key: SMTP_USERNAME
                      optional: true
                - name: SMTP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sync-log-triage-secrets
                      key: SMTP_PASSWORD
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /opt/analyzer/scripts
                  readOnly: true
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: analyzer-scripts
            - name: data
              persistentVolumeClaim:
                claimName: sync-log-triage-state
            - name: tmp
              emptyDir: {}
