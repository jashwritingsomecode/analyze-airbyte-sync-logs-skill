# TEMPLATE ONLY — DO NOT COMMIT REAL VALUES, AND DO NOT `kubectl apply` THIS FILE.
#
# Create the Secret imperatively so credentials never land in version control:
#
#   kubectl -n airbyte create secret generic sync-log-triage-secrets \
#     --from-literal=AIRBYTE_API_USER='<airbyte-api-user>' \
#     --from-literal=AIRBYTE_API_PASSWORD='<airbyte-api-password>' \
#     --from-literal=SMTP_USERNAME='<smtp-username>' \
#     --from-literal=SMTP_PASSWORD='<smtp-password>'
#
# Omit any key you do not use (e.g. no SMTP auth, or Airbyte API without auth) —
# all secret-sourced env vars are marked optional in the CronJob.
#
# This file is shown only to document the expected keys.
apiVersion: v1
kind: Secret
metadata:
  name: sync-log-triage-secrets
  labels:
    app.kubernetes.io/name: sync-log-triage
type: Opaque
stringData:
  AIRBYTE_API_USER: "REPLACE_ME"
  AIRBYTE_API_PASSWORD: "REPLACE_ME"
  SMTP_USERNAME: "REPLACE_ME"
  SMTP_PASSWORD: "REPLACE_ME"
